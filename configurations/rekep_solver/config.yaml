device: cuda
seed: 0
main:
  interpolate_pos_step_size: 0.0001
  interpolate_rot_step_size: 0.1
  timestep: 0.0001
  act_seq_num: 2000
  max_ee_angular_vel: 2.0
  bounds_min: &id001
  - -0.2
  - -0.5
  - -0.1
  bounds_max: &id002
  - 0.8
  - 0.5
  - 0.9
  grasp_depth: 0.0
  min_depth: 0.1
  max_depth: 2.0
  pointcloud_bounds_min:
  - 0
  - -0.5
  - 0.01
  pointcloud_bounds_max:
  - 0.8
  - 0.5
  - 0.9
  pointcloud_sample_num: 1024
  sdf_voxel_size: 0.01
  width: 640
  height: 480
  save_dir: outputs
  verbose: false
  max_retries_per_stage: 2
subgoal_solver:
  bounds_min: *id001
  bounds_max: *id002
  sampling_maxfun: 50000
  max_collision_points: 600
  constraint_tolerance: 0.0005
  minimizer_options:
    maxiter: 2000
camera:
  cam_name_list:
  - front
  width: 640
  height: 480
visualizer:
  render_mujoco: false
  render_visualizer: false
  save_video: false
  quality: medium
  save_dir: outputs
  map_size: 0.5
  fps: 24
lerobot:
  fps: 50
